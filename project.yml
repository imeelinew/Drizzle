name: Drizzle
options:
  bundleIdPrefix: com.eli
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
  postGenCommand: perl -i -pe 's/lastKnownFileType = folder; path = Drizzle\.icon;/lastKnownFileType = folder.iconcomposer.icon; path = Drizzle.icon;/' Drizzle.xcodeproj/project.pbxproj
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_LANGUAGE: zh-Hans
targets:
  Drizzle:
    type: application
    platform: macOS
    sources:
      - Drizzle
      - path: Drizzle.icon
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.eli.Drizzle
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_LANGUAGE: zh-Hans
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        INFOPLIST_KEY_CFBundleIconName: Drizzle
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: Drizzle
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
schemes:
  Drizzle:
    build:
      targets:
        Drizzle: all
    run:
      config: Debug
